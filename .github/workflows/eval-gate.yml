name: Eval Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Offline eval (no LLM, no server) ──────────────────────────────────
  offline-eval:
    name: Offline Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run offline tests
        env:
          OPENAI_API_KEY: offline-test-fake-key
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: python -m pytest eval/offline/ -q --tb=short

  # ── Job 2: Live gate (spins up full stack, runs 7 gate cases) ────────────────
  live-gate:
    name: Live Gate
    runs-on: ubuntu-latest
    needs: offline-eval  # only run if offline passes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build app image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: amazon-device-support-bot-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Start full stack ─────────────────────────────────────────────────────
      - name: Build and start services
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          PAGEINDEX_API_KEY: "ci-not-used"
        run: |
          docker compose up -d --build
          echo "Waiting for app health check..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "App is ready."
              break
            fi
            echo "Attempt $i/60 — retrying in 10s..."
            sleep 10
          done
          curl -sf http://localhost:8000/health || (docker compose logs app && exit 1)

      # ── Seed MongoDB from committed fixture — no PageIndex API call needed ────
      - name: Seed MongoDB document trees
        run: |
          python3 - <<'EOF'
          import asyncio, json
          import motor.motor_asyncio

          async def seed():
              client = motor.motor_asyncio.AsyncIOMotorClient("mongodb://localhost:27017")
              with open("prep/seed/document_trees.json") as f:
                  docs = [json.loads(line) for line in f if line.strip()]
              for doc in docs:
                  await client.support_bot.document_trees.replace_one(
                      {"doc_id": doc["doc_id"]}, doc, upsert=True
                  )
              print(f"Seeded {len(docs)} document tree(s)")
              client.close()

          asyncio.run(seed())
          EOF

      # ── Run gate cases ────────────────────────────────────────────────────────
      - name: Run live gate
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EVAL_APP_URL: http://localhost:8000
          POSTGRES_DSN: ${{ secrets.NEON_DSN }}
        run: |
          touch /tmp/gate_output.txt
          python -m eval.live_gate 2>&1 | tee /tmp/gate_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # ── Post markdown report as PR comment ───────────────────────────────────
      - name: Post gate report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.existsSync('/tmp/gate_output.txt')
              ? fs.readFileSync('/tmp/gate_output.txt', 'utf8')
              : 'No output captured — gate step failed to start. Check the Actions log for details.';
            const exitCode = '${{ steps.gate.outputs.exit_code }}';
            const header = exitCode === '0'
              ? '## ✅ Eval Gate Passed'
              : '## ❌ Eval Gate Failed — Merge Blocked';

            const body = `${header}\n\n<details><summary>Full gate output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Eval Gate')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if gate failed
        if: steps.gate.outputs.exit_code != '0'
        run: exit 1

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app --tail=100
